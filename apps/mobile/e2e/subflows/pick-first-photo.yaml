# System photo picker (no app testIDs here): pick the newest photo, which addMedia just added.
appId: com.petwatch.app
---
# Android (Google photo picker): allow access if asked; newer pickers confirm with "Done".
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible: 'Allow'
          commands:
            - tapOn: 'Allow'
      - extendedWaitUntil:
          visible: 'Photo taken on.*'
          timeout: 15000
      - tapOn:
          text: 'Photo taken on.*'
          index: 0
      - runFlow:
          when:
            visible: 'Done'
          commands:
            - tapOn: 'Done'
# iOS (PHPicker): grid cells are labelled "Photo, <date>", newest first; a tap returns it.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: 'PXGGridLayout-Info'
          timeout: 15000
      - tapOn:
          id: 'PXGGridLayout-Info'
          index: 0
