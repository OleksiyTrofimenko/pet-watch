# Registers EMAIL/PASSWORD through the sign-up screen, starting from the login screen.
# Flows that only need an existing user should create it with scripts/api.js instead (faster).
appId: com.petwatch.app
---
- tapOn:
    id: 'login.register-link'
- tapOn:
    id: 'register.email'
- inputText: ${EMAIL}
- tapOn:
    id: 'register.password'
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: 'register.submit'
