# Registers EMAIL/PASSWORD through the sign-up screen.
# Usage: - runFlow: { file: ../subflows/register.yaml, env: { EMAIL: ..., PASSWORD: ... } }
# The testIDs below are the contract for the AUTH-1 screen (see apps/mobile/CLAUDE.md → E2E).
# Flows that only need a logged-in user should create it with scripts/api.js instead (faster).
appId: com.petwatch.app
---
- tapOn:
    id: 'login.register-link'
- tapOn:
    id: 'register.email'
- inputText: ${EMAIL}
- tapOn:
    id: 'register.password'
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: 'register.submit'
