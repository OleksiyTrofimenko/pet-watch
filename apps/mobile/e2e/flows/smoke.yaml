# Smoke: the dev build starts and, signed out, shows the login screen.
appId: com.petwatch.app
name: Smoke – app launches
---
- runFlow: ../subflows/launch-signed-out.yaml
# A cold Metro can take a while to build the first bundle.
- extendedWaitUntil:
    visible:
      id: 'login.submit'
    timeout: 60000
