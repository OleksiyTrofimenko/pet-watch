# A protected deep link opened while signed out survives the login (cold start: app not running).
appId: com.petwatch.app
name: Deep link – invite opened while signed out
env:
  PASSWORD: walkies-123
---
- runFlow: ../subflows/new-email.yaml
- runScript:
    file: ../scripts/api.js
    env:
      EMAIL: ${output.email}
      PASSWORD: ${PASSWORD}
- launchApp:
    clearState: true
- stopApp
- openLink: petwatch://invites/e2e-token-that-does-not-exist-000000000000
- extendedWaitUntil:
    visible:
      id: 'login.submit'
    timeout: 60000
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: ${PASSWORD}
# Back on the invite screen after login. The token is made up, so it's the "unavailable" state;
# flows/invite.yaml accepts a real one.
- extendedWaitUntil:
    visible:
      id: 'invite.unavailable'
    timeout: 20000
