# N-3 (Android: setAirplaneMode isn't available on the iOS simulator). Offline: banner, cached
# schedule with "Updated HH:MM", writes disabled with a reason; back online: banner goes away.
appId: com.petwatch.app
name: Offline – banner, cached data, writes disabled
tags:
  - android-only
env:
  PASSWORD: walkies-123
---
- runFlow: ../subflows/new-email.yaml
- runScript:
    file: ../scripts/api.js
    env:
      EMAIL: ${output.email}
      PASSWORD: ${PASSWORD}
- runScript:
    file: ../scripts/create-pet.js
    env:
      ACCESS_TOKEN: ${output.accessToken}
      NAME: Rex
      SPECIES: DOG
- runFlow: ../subflows/launch-signed-out.yaml
- extendedWaitUntil:
    visible:
      id: 'login.submit'
    timeout: 60000
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: ${PASSWORD}
- assertVisible:
    id: 'schedule.title'
# Visit the pet once online so its detail is cached too.
- tapOn:
    id: 'tab.pets'
- tapOn:
    id: 'pets.card-Rex'
- assertVisible:
    id: 'pet.title'

- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: 'offline.banner'
    timeout: 20000
- assertVisible: "You're offline. Showing saved data."
- assertVisible:
    id: 'pet.title'
- tapOn:
    id: 'pet.add-task'
- tapOn:
    id: 'task-form.title'
- inputText: Breakfast
- hideKeyboard
- scrollUntilVisible:
    element: 'Connect to the internet to save.'
- assertVisible: 'Connect to the internet to save.'
- tapOn:
    id: 'task-form.cancel'
- tapOn:
    id: 'pet.back'
- tapOn:
    id: 'tab.index'
- assertVisible: 'Updated \d\d:\d\d'

- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible:
      id: 'offline.banner'
    timeout: 30000
- assertNotVisible: 'Updated \d\d:\d\d'
