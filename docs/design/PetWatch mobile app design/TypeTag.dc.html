<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:{{ bg }};color:{{ fg }};font-family:Figtree,system-ui,sans-serif;font-size:13px;line-height:16px;font-weight:600;white-space:nowrap;box-sizing:border-box"><dc-import name="Icon" icon="{{ icon }}" size="{{ iconSize }}" color="{{ fg }}" hint-size="16px,16px"></dc-import><span>{{ label }}</span></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:40},&quot;type&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;feeding&quot;,&quot;walk&quot;,&quot;medication&quot;,&quot;play&quot;,&quot;grooming&quot;,&quot;other&quot;],&quot;default&quot;:&quot;feeding&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = {
      feeding: ['Feeding', '#FAEACB', '#8F6014'],
      walk: ['Walk', '#D9EBDC', '#2F653C'],
      medication: ['Medication', '#D8E4F4', '#2E4E7D'],
      play: ['Play', '#F6E0D5', '#8F4227'],
      grooming: ['Grooming', '#EEDFEE', '#663866'],
      other: ['Other', '#EFEBE5', '#62594F'],
    };
    const t = m[this.props.type] ? this.props.type : 'other';
    const [label, bg, fg] = m[t];
    return { label, bg, fg, icon: t, iconSize: 16 };
  }
}
</script>
</body>
</html>
