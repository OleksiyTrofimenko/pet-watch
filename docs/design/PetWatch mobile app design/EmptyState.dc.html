<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:32px 24px;font-family:Figtree,system-ui,sans-serif;box-sizing:border-box"><div style="width:64px;height:64px;border-radius:999px;background:{{ circleBg }};display:flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="{{ icon }}" size="28" color="{{ iconC }}" hint-size="28px,28px"></dc-import></div><span style="font-family:Newsreader,Georgia,serif;font-size:22px;line-height:28px;font-weight:600;color:#2A2520;text-wrap:balance">{{ title }}</span><sc-if value="{{ body }}"><span style="font-size:15px;line-height:22px;color:#4A433B;max-width:300px;text-wrap:pretty">{{ body }}</span></sc-if><sc-if value="{{ cta }}"><div style="margin-top:8px"><dc-import name="Btn" label="{{ cta }}" icon="{{ ctaIcon }}" variant="{{ ctaVariant }}" hint-size="200px,48px"></dc-import></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:358,&quot;height&quot;:300},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;paw&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;No pets yet&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;neutral&quot;,&quot;primary&quot;,&quot;error&quot;,&quot;success&quot;,&quot;info&quot;,&quot;warning&quot;],&quot;default&quot;:&quot;neutral&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const tone = this.props.tone ?? 'neutral';
    const t = { neutral: ['#EFEBE5', '#62594F'], primary: ['#F6E0D5', '#8F4227'], error: ['#FADCD7', '#962A23'], success: ['#D9EBDC', '#2F653C'], info: ['#D8E4F4', '#2E4E7D'], warning: ['#FAEACB', '#8F6014'] }[tone];
    return {
      icon: this.props.icon ?? 'paw', title: this.props.title ?? 'Nothing here yet', body: this.props.body ?? '',
      cta: this.props.cta ?? '', ctaIcon: this.props.ctaIcon ?? '', ctaVariant: this.props.ctaVariant ?? 'solid',
      circleBg: t[0], iconC: t[1],
    };
  }
}
</script>
</body>
</html>
