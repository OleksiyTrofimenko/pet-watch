<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:{{ s }}px;height:{{ s }}px;border-radius:999px;background:{{ bg }};color:{{ fg }};display:flex;align-items:center;justify-content:center;flex:none;font-family:Figtree,system-ui,sans-serif;font-weight:700;font-size:{{ fs }}px;line-height:1;box-shadow:{{ ring }}">{{ letter }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:60,&quot;height&quot;:60},&quot;pet&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rex&quot;,&quot;miso&quot;],&quot;default&quot;:&quot;rex&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:40,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const tones = { warning: ['#FAEACB', '#8F6014'], tertiary: ['#EEDFEE', '#663866'], info: ['#D8E4F4', '#2E4E7D'], success: ['#D9EBDC', '#2F653C'], primary: ['#F6E0D5', '#8F4227'], secondary: ['#EFEBE5', '#62594F'] };
    const pets = { rex: ['R', 'warning'], miso: ['M', 'tertiary'] };
    const p = pets[this.props.pet];
    const letter = this.props.letter ?? (p ? p[0] : '?');
    const [bg, fg] = tones[this.props.tone ?? (p ? p[1] : 'info')] || tones.info;
    const s = Number(this.props.size ?? 32);
    return { s, bg, fg, letter, fs: Math.round(s * 0.44), ring: this.props.ring ? '0 0 0 2px #FFFFFF' : 'none' };
  }
}
</script>
</body>
</html>
