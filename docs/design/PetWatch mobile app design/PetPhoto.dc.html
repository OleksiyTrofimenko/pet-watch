<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:{{ w }};height:{{ h }};border-radius:{{ r }};flex:none;overflow:hidden;position:relative;background:{{ bg }};display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;box-sizing:border-box"><sc-if value="{{ isPhoto }}"><div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,0) 0 12px,rgba(255,255,255,.28) 12px 24px)"></div><sc-if value="{{ caption }}"><span style="position:relative;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:14px;color:{{ fg }};background:rgba(255,255,255,.7);padding:2px 6px;border-radius:999px">{{ caption }}</span></sc-if></sc-if><sc-if value="{{ isSpecies }}"><dc-import name="Icon" icon="paw" fill="{{ true }}" size="{{ iconSize }}" color="#A89D8F" hint-size="24px,24px"></dc-import><sc-if value="{{ showSpecies }}"><span style="font-family:Figtree,system-ui,sans-serif;font-size:12px;line-height:16px;font-weight:600;color:#62594F">{{ species }}</span></sc-if></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const pets = { rex: ['#E9C98F', '#5A3A0B', 'rex.jpg', 'Dog'], miso: ['#D9BFD8', '#3D223D', 'miso.jpg', 'Cat'] };
    const p = pets[this.props.pet] || pets.rex;
    const isSpecies = !!this.props.noPhoto;
    const wn = parseInt(this.props.w ?? 72, 10);
    return {
      w: this.props.w ?? '72px', h: this.props.h ?? '72px', r: this.props.r ?? '8px',
      bg: isSpecies ? '#EFEBE5' : p[0], fg: p[1],
      isPhoto: !isSpecies, isSpecies,
      caption: wn >= 140 ? `${p[2]} · photo` : '',
      species: this.props.species ?? p[3], showSpecies: wn >= 64,
      iconSize: wn >= 140 ? 48 : 26,
    };
  }
}
</script>
</body>
</html>
