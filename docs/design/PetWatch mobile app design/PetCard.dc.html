<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="button" style="display:flex;gap:16px;align-items:center;padding:12px 4px 12px 12px;background:#FFFFFF;border-radius:16px;border:1px solid #E9E3DA;min-height:96px;box-sizing:border-box;font-family:Figtree,system-ui,sans-serif"><dc-import name="PetPhoto" pet="{{ pet }}" no-photo="{{ noPhoto }}" w="72px" h="72px" r="8px" hint-size="72px,72px"></dc-import><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-family:Newsreader,Georgia,serif;font-size:22px;line-height:28px;font-weight:600;color:#2A2520">{{ name }}</span><span style="font-size:14px;line-height:20px;color:#4A433B">{{ meta }}</span><div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px"><dc-import name="RoleBadge" kind="{{ role }}" hint-size="76px,22px"></dc-import><sc-if value="{{ watchers }}"><div style="display:flex;align-items:center;gap:4px;font-size:13px;line-height:18px;color:#4A433B;font-weight:600"><dc-import name="Icon" icon="users" size="14" color="#4A433B" hint-size="14px,14px"></dc-import><span>{{ watchers }}</span></div></sc-if><sc-if value="{{ owner }}"><span style="font-size:13px;line-height:18px;color:#4A433B">by {{ owner }}</span></sc-if></div></div><div style="width:40px;height:44px;display:flex;align-items:center;justify-content:center;flex:none"><dc-import name="Icon" icon="chevronRight" size="20" color="#6A6158" hint-size="20px,20px"></dc-import></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:358,&quot;height&quot;:120},&quot;pet&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rex&quot;,&quot;miso&quot;],&quot;default&quot;:&quot;rex&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;owner&quot;,&quot;watching&quot;],&quot;default&quot;:&quot;owner&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;watchers&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2 watchers&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;owner&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;noPhoto&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const pets = { rex: ['Rex', 'Dog · Labrador · 4 yrs'], miso: ['Miso', 'Cat · 2 yrs'] };
    const pet = this.props.pet ?? 'rex';
    const p = pets[pet] || pets.rex;
    return {
      pet, noPhoto: !!this.props.noPhoto, name: this.props.name ?? p[0], meta: this.props.meta ?? p[1],
      role: this.props.role ?? 'owner', watchers: this.props.watchers ?? '', owner: this.props.owner ?? '',
    };
  }
}
</script>
</body>
</html>
