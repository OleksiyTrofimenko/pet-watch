<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@keyframes pw-spin{to{transform:rotate(360deg)}}</style></helmet><div role="button" style="display:flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;min-height:{{ h }}px;width:{{ width }};padding:{{ pad }};border-radius:8px;background:{{ bg }};color:{{ fg }};border:1.5px solid {{ bd }};font-family:Figtree,system-ui,sans-serif;font-size:16px;line-height:20px;font-weight:600;text-decoration:{{ deco }};text-underline-offset:3px;cursor:pointer;text-align:center"><sc-if value="{{ loading }}">{{ spinner }}</sc-if><sc-if value="{{ showIcon }}"><dc-import name="Icon" icon="{{ icon }}" size="20" color="{{ fg }}" hint-size="20px,20px"></dc-import></sc-if><span>{{ label }}</span></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:60},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Save&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;solid&quot;,&quot;outline&quot;,&quot;link&quot;],&quot;default&quot;:&quot;solid&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;action&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;primary&quot;,&quot;secondary&quot;,&quot;negative&quot;],&quot;default&quot;:&quot;primary&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;,&quot;lg&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;loading&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;full&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'solid', a = this.props.action ?? 'primary';
    const dis = !!this.props.disabled, loading = !!this.props.loading;
    const pal = {
      primary: { solid: ['#AE5230', '#FFFFFF', '#AE5230'], outline: ['#FFFFFF', '#8F4227', '#AE5230'], link: ['transparent', '#8F4227', 'transparent'] },
      negative: { solid: ['#B8342B', '#FFFFFF', '#B8342B'], outline: ['#FFFFFF', '#962A23', '#B8342B'], link: ['transparent', '#962A23', 'transparent'] },
      secondary: { solid: ['#EFEBE5', '#34302B', '#EFEBE5'], outline: ['#FFFFFF', '#34302B', '#8C8174'], link: ['transparent', '#4A433B', 'transparent'] },
    };
    let [bg, fg, bd] = (pal[a] || pal.primary)[v] || pal.primary.solid;
    if (dis) { if (v === 'link') fg = '#6A6158'; else { bg = '#E9E3DA'; fg = '#6A6158'; bd = '#E9E3DA'; } }
    const spinner = React.createElement('span', { style: { width: 18, height: 18, borderRadius: 999, border: `2.5px solid ${fg}`, borderRightColor: 'transparent', boxSizing: 'border-box', animation: 'pw-spin .8s linear infinite', flex: 'none' } });
    return {
      bg, fg, bd, loading, spinner, label: this.props.label ?? 'Button',
      h: this.props.size === 'lg' ? 52 : this.props.size === 'sm' ? 44 : 48,
      width: this.props.full ? '100%' : 'auto',
      pad: v === 'link' ? '0 6px' : '0 20px',
      deco: v === 'link' ? 'underline' : 'none',
      icon: this.props.icon, showIcon: !!this.props.icon && !loading,
    };
  }
}
</script>
</body>
</html>
