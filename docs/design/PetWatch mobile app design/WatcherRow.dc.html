<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:12px;padding:12px 4px 12px 16px;min-height:72px;box-sizing:border-box;background:#FFFFFF;border-radius:16px;border:1px solid #E9E3DA;font-family:Figtree,system-ui,sans-serif"><dc-import name="Avatar" letter="{{ letter }}" tone="info" size="40" hint-size="40px,40px"></dc-import><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font-size:16px;line-height:22px;font-weight:600;color:#2A2520;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ email }}</span><sc-if value="{{ pending }}"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><dc-import name="RoleBadge" kind="pending" hint-size="76px,22px"></dc-import><span style="font-size:14px;line-height:20px;color:#4A433B">{{ expires }}</span></div></sc-if><sc-if value="{{ active }}"><span style="font-size:14px;line-height:20px;color:#4A433B">{{ since }}</span></sc-if></div><sc-if value="{{ showAction }}"><div role="button" style="min-height:44px;padding:0 12px;display:flex;align-items:center;font-size:15px;line-height:20px;font-weight:600;color:#962A23;text-decoration:underline;text-underline-offset:3px;flex:none">{{ actionLabel }}</div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:358,&quot;height&quot;:90},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;sam@example.com&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pending&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;since&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Watching since 12 Sep&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;expires&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Expires in 5 days&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const email = this.props.email ?? 'sam@example.com';
    const pending = !!this.props.pending;
    return {
      email, letter: email[0].toUpperCase(), pending, active: !pending,
      since: this.props.since ?? 'Watching since 12 Sep', expires: this.props.expires ?? 'Expires in 5 days',
      showAction: !this.props.hideAction, actionLabel: this.props.actionLabel ?? (pending ? 'Cancel' : 'Remove'),
    };
  }
}
</script>
</body>
</html>
