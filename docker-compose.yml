# Local infrastructure only. The API and the Expo app run on the host
# so hot reload and simulators work without container networking tricks.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: petwatch
      POSTGRES_PASSWORD: petwatch
      POSTGRES_DB: petwatch
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petwatch"]
      interval: 5s
      retries: 10

  # S3-compatible storage. Same AWS SDK code works against real S3.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: petwatch
      MINIO_ROOT_PASSWORD: petwatch-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # Creates the private bucket once MinIO is up.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 petwatch petwatch-secret; do sleep 1; done;
      mc mb --ignore-existing local/petwatch;
      mc anonymous set none local/petwatch;
      "

  # Catches all outgoing SMTP. Inspect invites/reset mails at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  miniodata:
